<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consulta de Activo Eventual — Asistente IA</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center py-6 px-3">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col" style="height: 90vh;">

    <!-- Encabezado del activo -->
    <div class="bg-blue-700 text-white p-4">
      <p class="text-xs uppercase tracking-wide text-blue-200">Activo Eventual — Banco</p>
      <h1 id="nombreActivo" class="text-lg font-bold leading-tight">Cargando activo...</h1>
      <p id="precioActivo" class="text-blue-100 text-sm mt-1"></p>
    </div>

    <!-- Ventana de conversación -->
    <div id="chatWindow" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>

    <!-- Botón limpiar -->
    <div class="px-4 pb-1">
      <button id="btnLimpiar" class="text-xs text-slate-500 hover:text-red-600 underline">
        Limpiar conversación
      </button>
    </div>

    <!-- Entrada de texto -->
    <form id="formPregunta" class="flex items-center gap-2 p-3 border-t bg-white">
      <input
        id="inputPregunta"
        type="text"
        placeholder="Escribe tu pregunta sobre este activo..."
        class="flex-1 border border-slate-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        autocomplete="off"
      />
      <button
        type="submit"
        class="bg-blue-700 text-white rounded-full px-4 py-2 text-sm font-semibold hover:bg-blue-800"
      >
        Preguntar
      </button>
    </form>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const activoId = params.get('activo') || 'activo001';

  const chatWindow = document.getElementById('chatWindow');
  const nombreActivo = document.getElementById('nombreActivo');
  const precioActivo = document.getElementById('precioActivo');
  const form = document.getElementById('formPregunta');
  const input = document.getElementById('inputPregunta');
  const btnLimpiar = document.getElementById('btnLimpiar');

  // Cargar datos del activo para mostrar el encabezado
  fetch('/data/activos.json')
    .then(r => r.json())
    .then(activos => {
      const activo = activos[activoId];
      if (activo) {
        nombreActivo.textContent = activo.nombre;
        precioActivo.textContent = activo.precio;
      } else {
        nombreActivo.textContent = 'Activo no encontrado';
      }
    });

  function agregarBurbuja(texto, quien) {
    const burbuja = document.createElement('div');
    burbuja.className = quien === 'usuario'
      ? 'ml-auto bg-blue-600 text-white rounded-2xl rounded-br-sm px-4 py-2 max-w-[75%] text-sm'
      : 'mr-auto bg-slate-200 text-slate-800 rounded-2xl rounded-bl-sm px-4 py-2 max-w-[75%] text-sm';
    burbuja.textContent = texto;
    chatWindow.appendChild(burbuja);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  // Mensaje de bienvenida
  agregarBurbuja('¡Hola! Soy el asistente virtual de este activo. Pregúntame lo que quieras saber sobre él (precio, tamaño, condiciones de venta, etc.).', 'ia');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pregunta = input.value.trim();
    if (!pregunta) return;

    agregarBurbuja(pregunta, 'usuario');
    input.value = '';
    agregarBurbuja('Escribiendo...', 'ia');

    try {
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activoId, pregunta })
      });
      const data = await res.json();

      // Quitar el "Escribiendo..."
      chatWindow.lastChild.remove();

      agregarBurbuja(data.respuesta || data.error || 'Ocurrió un error.', 'ia');
    } catch (err) {
      chatWindow.lastChild.remove();
      agregarBurbuja('Error de conexión. Intenta de nuevo.', 'ia');
    }
  });

  btnLimpiar.addEventListener('click', () => {
    chatWindow.innerHTML = '';
    agregarBurbuja('Conversación reiniciada. ¿En qué puedo ayudarte sobre este activo?', 'ia');
  });
</script>
</body>
</html>
